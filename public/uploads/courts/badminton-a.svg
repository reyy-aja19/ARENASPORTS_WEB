<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="badmintonBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="50%" stop-color="#146c43" />
      <stop offset="100%" stop-color="#0d4128" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#badmintonBg1)" />
  <g transform="translate(100, 60)" filter="url(#shadow)">
    <!-- Court Mat -->
    <rect width="600" height="380" rx="8" fill="#198754" stroke="#ffffff" stroke-width="4" />
    <!-- Outer boundary -->
    <rect x="25" y="25" width="550" height="330" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9" />
    <!-- Singles sidelines -->
    <line x1="25" y1="50" x2="575" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <line x1="25" y1="330" x2="575" y2="330" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <!-- Center Net -->
    <line x1="300" y1="20" x2="300" y2="360" stroke="#f8fafc" stroke-width="4" />
    <!-- Short Service lines -->
    <line x1="210" y1="25" x2="210" y2="355" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
    <line x1="390" y1="25" x2="390" y2="355" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
    <!-- Center Line -->
    <line x1="25" y1="190" x2="210" y2="190" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
    <line x1="390" y1="190" x2="575" y2="190" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
    <!-- Badminton Shuttlecock Icon in Net -->
    <circle cx="300" cy="190" r="18" fill="#ffffff" opacity="0.9" />
    <circle cx="300" cy="190" r="10" fill="#198754" />
  </g>
  <text x="400" y="475" text-anchor="middle" fill="#d1e7dd" font-family="Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="2">LAPANGAN BADMINTON ARENASPORTS A</text>
</svg>

