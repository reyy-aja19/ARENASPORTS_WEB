<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="futsalGrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <pattern id="turfStripes" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="40" fill="#ffffff" opacity="0.04" />
      <rect x="20" width="20" height="40" fill="#000000" opacity="0.04" />
    </pattern>
    <filter id="futsalShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#futsalGrass)" />
  <rect width="800" height="500" fill="url(#turfStripes)" />
  
  <g transform="translate(80, 50)" filter="url(#futsalShadow)">
    <!-- Pitch boundary -->
    <rect width="640" height="400" rx="6" fill="#059669" stroke="#ffffff" stroke-width="4" />
    <!-- Center line -->
    <line x1="320" y1="0" x2="320" y2="400" stroke="#ffffff" stroke-width="3" />
    <!-- Center circle -->
    <circle cx="320" cy="200" r="50" fill="none" stroke="#ffffff" stroke-width="3" />
    <circle cx="320" cy="200" r="4" fill="#ffffff" />
    <!-- Left Penalty Area -->
    <path d="M 0,110 A 90,90 0 0,1 90,200 A 90,90 0 0,1 0,290 Z" fill="none" stroke="#ffffff" stroke-width="3" />
    <circle cx="60" cy="200" r="4" fill="#ffffff" />
    <!-- Left Goal -->
    <rect x="-15" y="160" width="15" height="80" fill="none" stroke="#ffffff" stroke-width="3" />
    <!-- Right Penalty Area -->
    <path d="M 640,110 A 90,90 0 0,0 550,200 A 90,90 0 0,0 640,290 Z" fill="none" stroke="#ffffff" stroke-width="3" />
    <circle cx="580" cy="200" r="4" fill="#ffffff" />
    <!-- Right Goal -->
    <rect x="640" y="160" width="15" height="80" fill="none" stroke="#ffffff" stroke-width="3" />
    <!-- Corner Arcs -->
    <path d="M 0,20 A 20,20 0 0,1 20,0" fill="none" stroke="#ffffff" stroke-width="3" />
    <path d="M 0,380 A 20,20 0 0,0 20,400" fill="none" stroke="#ffffff" stroke-width="3" />
    <path d="M 640,20 A 20,20 0 0,0 620,0" fill="none" stroke="#ffffff" stroke-width="3" />
    <path d="M 640,380 A 20,20 0 0,1 620,400" fill="none" stroke="#ffffff" stroke-width="3" />
  </g>
  <text x="400" y="480" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="2">LAPANGAN FUTSAL INTERNASIONAL ARENASPORTS A</text>
</svg>

